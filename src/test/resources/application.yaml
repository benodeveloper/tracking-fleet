spring:
  datasource:
    url: jdbc:h2:mem:fleet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-change-me-please-32-bytes-min
    expiration-seconds: 3600
